[project]
name = "rashid-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "agent-framework>=1.2",
    "agent-framework-ag-ui>=1.0.0b0",
    "pyyaml",
    "pydantic-settings",
    "python-dotenv",
    "azure-monitor-opentelemetry",
    "azure-storage-blob",
    "opentelemetry-sdk>=1.40.0,<1.41.0",
    "opentelemetry-api>=1.40.0,<1.41.0",
    "numpy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
